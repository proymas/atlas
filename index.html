<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#050a14" />
  <meta name="format-detection" content="telephone=no" />
  <title>Atlas — Valida una idea antes de construirla</title>
  <meta name="description" content="Atlas convierte una idea de negocio en un diagnóstico, evidencias, experimentos y siguientes decisiones para validar antes de construir." />
  <link rel="stylesheet" href="/assets/tokens.css" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link rel="stylesheet" href="/assets/landing.css" />
  <link rel="stylesheet" href="/assets/compatibility.css" />
  <link rel="stylesheet" href="/assets/print-report.css" media="print" />
</head>
<body>
  <header class="site-header">
    <div class="container nav atlas-header-grid">
      <div class="atlas-header-left">
        <a class="brand" href="#top" aria-label="Atlas">ATLAS <span>BETA 3.4</span></a>
        <div class="atlas-header-left-controls">
          <div class="language-switcher" aria-label="Language selector">
            <button type="button" data-locale="es">ES</button><span>/</span><button type="button" data-locale="en">EN</button>
          </div>
        </div>
      </div>
      <nav class="atlas-header-center" aria-label="Main navigation">
        <a href="#como-funciona" data-i18n="nav.how"></a>
        <a href="#ejemplo" data-i18n="nav.example"></a>
        <a href="#principios" data-i18n="nav.principles"></a>
      </nav>
      <div class="nav-actions atlas-header-right">
        <a class="button button-small atlas-header-cta" href="#validator" data-i18n="nav.try"></a>
      </div>
    </div>
  </header>

  <main id="top">
    <section class="hero hero-premium container" aria-labelledby="hero-title">
      <div class="hero-copy-block">
        <p class="eyebrow" data-i18n="hero.eyebrow"></p>
        <h1 id="hero-title"><span data-i18n="hero.title"></span><br /><span data-i18n="hero.titleAccent"></span></h1>
        <p class="hero-copy" data-i18n="hero.copy"></p>
        <div class="hero-actions hero-actions-row">
          <a class="button" href="#validator" data-i18n="hero.cta"></a>
          <a class="secondary-link" href="#ejemplo" data-i18n="hero.secondary"></a>
        </div>
        <p class="hero-note" data-i18n="hero.note"></p>
      </div>
      <aside class="hero-proof" aria-label="Report preview">
        <div class="proof-topline"><span data-i18n="proof.report"></span><span>72/100</span></div>
        <p class="proof-label" data-i18n="proof.verdictLabel"></p>
        <h2 data-i18n="proof.verdict"></h2>
        <p data-i18n="proof.summary"></p>
        <div class="proof-metrics">
          <span><strong>3</strong> <span data-i18n="proof.strengths"></span></span>
          <span><strong>4</strong> <span data-i18n="proof.risks"></span></span>
          <span><strong>1</strong> <span data-i18n="proof.experiment"></span></span>
        </div>
      </aside>
    </section>

    <section class="trust-strip"><div class="container trust-grid"><p data-i18n="trust.0"></p><p data-i18n="trust.1"></p><p data-i18n="trust.2"></p></div></section>

    <section id="como-funciona" class="section container story-section">
      <div class="section-heading section-heading-left"><p class="eyebrow" data-i18n="process.eyebrow"></p><h2 data-i18n="process.title"></h2><p data-i18n="process.copy"></p></div>
      <div class="process-grid">
        <article><span class="step-number">01</span><h3 data-i18n="process.steps.0.0"></h3><p data-i18n="process.steps.0.1"></p></article>
        <article><span class="step-number">02</span><h3 data-i18n="process.steps.1.0"></h3><p data-i18n="process.steps.1.1"></p></article>
        <article><span class="step-number">03</span><h3 data-i18n="process.steps.2.0"></h3><p data-i18n="process.steps.2.1"></p></article>
      </div>
    </section>

    <section id="principios" class="section principle-manifesto"><div class="container manifesto-layout">
      <div><p class="eyebrow" data-i18n="principles.eyebrow"></p><h2 data-i18n-html="principles.title"></h2></div>
      <div class="manifesto-copy"><p data-i18n="principles.lines.0"></p><p data-i18n="principles.lines.1"></p><p data-i18n="principles.lines.2"></p><strong data-i18n="principles.strong"></strong></div>
    </div></section>

    <section id="ejemplo" class="section container example-section">
      <div class="section-heading"><p class="eyebrow" data-i18n="example.eyebrow"></p><h2 data-i18n="example.title"></h2><p data-i18n="example.copy"></p></div>
      <article class="report-preview"><header><div><p class="eyebrow" data-i18n="example.idea"></p><h3 data-i18n="example.name"></h3></div><div class="preview-score"><strong>74</strong><span>/100</span></div></header>
        <div class="preview-summary"><span data-i18n="example.status"></span><p data-i18n="example.summary"></p></div>
        <div class="preview-columns">
          <section><h4 data-i18n="example.cards.0.0"></h4><p data-i18n="example.cards.0.1"></p></section>
          <section><h4 data-i18n="example.cards.1.0"></h4><p data-i18n="example.cards.1.1"></p></section>
          <section><h4 data-i18n="example.cards.2.0"></h4><p data-i18n="example.cards.2.1"></p></section>
          <section><h4 data-i18n="example.cards.3.0"></h4><p data-i18n="example.cards.3.1"></p></section>
        </div>
      </article>
    </section>

    <section id="validator" class="section validator-section"><div class="container validator-layout">
      <aside class="validator-intro"><p class="eyebrow" data-i18n="validator.eyebrow"></p><h2 data-i18n="validator.title"></h2><p data-i18n="validator.copy"></p><ul><li data-i18n="validator.bullets.0"></li><li data-i18n="validator.bullets.1"></li><li data-i18n="validator.bullets.2"></li></ul></aside>
      <section class="app-card" aria-live="polite">
        <div class="progress-row"><span id="step-label"></span><span id="progress-label">0 %</span></div><div class="progress"><span id="progress-bar"></span></div>
        <div id="start-view"><label for="idea" data-i18n="validator.label"></label><p class="helper" data-i18n="validator.helper"></p><textarea id="idea" data-i18n-placeholder="validator.placeholder"></textarea><button id="start-button" class="button button-full" data-i18n="validator.analyze"></button><p id="start-error" class="error" role="alert"></p></div>
        <div id="question-view" class="hidden"><p id="question-reason" class="eyebrow"></p><h3 id="question-title"></h3><textarea id="answer" data-i18n-placeholder="validator.answerPlaceholder"></textarea><button id="answer-button" class="button button-full" data-i18n="validator.continue"></button><button id="restart-button" class="text-button" data-i18n="validator.restart"></button></div>
        <div id="loading-view" class="hidden loading-view"><div class="spinner" aria-hidden="true"></div><h3 data-i18n="validator.loadingTitle"></h3><p id="loading-copy"></p></div>
        <div id="report-view" class="hidden report-view"><p class="eyebrow" data-i18n="validator.verdict"></p><div class="report-header"><div><span id="score">—</span><small>/100</small></div><div><h3 id="verdict">—</h3><p id="summary"></p></div></div>
          <div class="report-grid"><article><h4 data-i18n="validator.strengths"></h4><ul id="strengths"></ul></article><article><h4 data-i18n="validator.risks"></h4><ul id="risks"></ul></article><article><h4 data-i18n="validator.assumptions"></h4><ul id="assumptions"></ul></article><article><h4 data-i18n="validator.dont"></h4><ul id="do-not-build"></ul></article><article class="experiment"><h4 id="experiment-name"></h4><ol id="experiment-steps"></ol></article></div>
          <div class="report-actions"><button id="share-button" class="secondary-button" data-i18n="validator.share"></button><button id="pdf-button" class="button" data-i18n="validator.pdf"></button><button id="new-analysis-button" class="text-button" data-i18n="validator.another"></button></div>
        </div>
      </section>
    </div></section>

    <section class="section final-cta"><div class="container final-cta-inner"><p class="eyebrow" data-i18n="cta.eyebrow"></p><h2 data-i18n="cta.title"></h2><a class="button" href="#validator" data-i18n="cta.button"></a></div></section>
  </main>

  <footer class="footer footer-premium"><div class="container footer-grid"><div><a class="brand" href="#top">ATLAS</a><p data-i18n="footer.tagline"></p></div><div><strong data-i18n="footer.product"></strong><a href="#como-funciona" data-i18n="nav.how"></a><a href="#ejemplo" data-i18n="nav.example"></a><a href="#validator">Validator</a></div><div><strong data-i18n="footer.principles"></strong><a href="#principios" data-i18n="footer.manifesto"></a><span data-i18n="footer.private"></span><span data-i18n="footer.noPublish"></span></div></div><div class="container footer-bottom"><span>Atlas Beta 3.4</span><span data-i18n="footer.disclaimer"></span></div></footer>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
